<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">ベクトルの足し算</title>
  <desc id="desc">a=(3,1)の先端からb=(-1,2)を描くと、原点から最後の点へ向かうa+b=(2,3)が得られる。</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f5da8"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2e7d5b"/></marker>
    <marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a4ba8"/></marker>
  </defs>
  <rect width="640" height="360" rx="8" fill="#ffffff"/>
  <g stroke="#e4eaf1" stroke-width="1">
    <path d="M140 70V270 M200 70V270 M260 70V270 M320 70V270 M380 70V270 M440 70V270 M140 80H470 M140 140H470 M140 200H470 M140 260H470"/>
  </g>
  <g stroke="#5a6478" stroke-width="1.5"><path d="M120 260H490 M200 280V45"/></g>
  <g fill="#5a6478" font-family="sans-serif" font-size="16">
    <text x="185" y="285">0</text><text x="255" y="282">1</text><text x="315" y="282">2</text><text x="375" y="282">3</text>
    <text x="176" y="205">1</text><text x="176" y="145">2</text><text x="176" y="85">3</text>
    <text x="499" y="267">x</text><text x="195" y="34">y</text>
  </g>
  <path d="M200 260L140 140" fill="none" stroke="#2e7d5b" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M140 140L320 80" fill="none" stroke="#2f5da8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M200 260L380 200" stroke="#2f5da8" stroke-width="3.5" marker-end="url(#blue)"/>
  <path d="M380 200L320 80" stroke="#2e7d5b" stroke-width="3.5" marker-end="url(#green)"/>
  <path d="M200 260L320 80" stroke="#7a4ba8" stroke-width="3.5" marker-end="url(#purple)"/>
  <g font-family="sans-serif" font-size="19" font-weight="bold">
    <text x="315" y="243" fill="#2f5da8">a = (3, 1)</text>
    <text x="393" y="139" fill="#2e7d5b">b = (−1, 2)</text>
    <text x="325" y="59" fill="#7a4ba8">a + b = (2, 3)</text>
  </g>
  <text x="320" y="330" text-anchor="middle" fill="#5a6478" font-family="sans-serif" font-size="17">一方の先端から、もう一方をつなぐ</text>
</svg>
